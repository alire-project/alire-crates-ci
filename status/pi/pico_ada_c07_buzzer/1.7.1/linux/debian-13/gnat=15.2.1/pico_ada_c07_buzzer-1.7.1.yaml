- '   Long_Description: Learn how to drive active and passive buzzers with the Raspberry
  Pi Pico using Ada.

  '
- 'From simple doorbell switches to PWM-generated sweeping alert tones - including
  hardware tips with flyback diodes and

  '
- 'oscilloscope measurements.

  '
- '

  '
- 'In this chapter we connect both active and passive buzzers to the Pico. We start
  with a simple button-controlled

  '
- 'doorbell, improve the passive buzzer with bit-banging, and finally create a clean
  sweeping alert tone using the Pico''s

  '
- 'PWM hardware. We also look at inductive-load protection and why a diode is essential.

  '
- '

  '
- 'Contained in Chapter 07 are:

  '
- '

  '
- "1. sketch_07_1_doorbell.adb\t- Chapter 7.1 Doorbell with active buzzer\n"
- "2. sketch_07_2_alert.adb\t- Chapter 7.2 Alert with passive buzzer\n"
- "3. pwm_alert.adb\t\t- Use PWM to drive an passive buzzer\n"
- "4. buzz_and_blink-main.adb\t- Use tasks to drive both a buzzer and an LED\n"
