- '   Long_Description: Extended board support package (XBSP) for the Raspberry Pi
  Pico.

  '
- '

  '
- 'This crate builds upon Jeremy Grosser''s official pico_bsp and adds a growing set
  of clean, reusable components for Ada

  '
- 'developers targeting the RP2040. It is developed alongside the [Pi Ada

  '
- 'Tutorial](https://pi-ada-tutorial.sourceforge.io/) but is equally suitable for
  any standalone embedded Ada project.

  '
- '

  '
- 'Current components:

  '
- '* Pico.Analog         - Analogue GPIO using PWM

  '
- '* Pico.Analog.RGB_LED - Analogue RGB LED control using PWM

  '
- '* Pico.Tone           - Square-wave tone generation using PWM

  '
- '* Pico.UART_IO        - Simple UART text I/O for the Debug Probe (115200 8N1 on
  GP0/GP1)

  '
- '* Pico.Utils          - Miscellaneous utilities

  '
- '

  '
- 'The crate is available in two variants:

  '
- '* `no_tasking` (default) - small, fast, and compatible with the light runtime

  '
- '* `tasking`              - thread-safe using protected objects (requires a tasking
  runtime)

  '
- '

  '
- 'All packages include full GNATdoc annotations.

  '
