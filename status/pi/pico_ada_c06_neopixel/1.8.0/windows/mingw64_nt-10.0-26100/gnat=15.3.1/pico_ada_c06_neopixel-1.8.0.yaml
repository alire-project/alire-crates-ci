- '   Long_Description: Learn how to drive WS2812 (NeoPixel) LEDs on the Raspberry
  Pi Pico using the RP2040

  '
- 'PIO in Ada. Includes a square-wave diagnostic, fixes for the official ws2812_demo,
  and two complete animation sketches.

  '
- '

  '
- 'From understanding the WS2812 protocol to writing our own PIO code and creating
  colourful animations - everything you

  '
- 'need to make NeoPixels dance with Ada on the Pico.

  '
- '

  '
- 'Contained in Chapter 06 are:

  '
- '

