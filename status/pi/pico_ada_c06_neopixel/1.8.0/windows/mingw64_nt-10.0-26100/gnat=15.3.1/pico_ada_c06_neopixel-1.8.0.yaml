- "1. square_wave-main.adb\t\t - Simple Square Wave test using PIO (for timing reference)\n"
- "1. ws2812_demo.adb\t\t - Jeremy Grosser's WS2812 demo adapted for the RP2040 and\
  \ Ada 2022\n"
- "2. sketch_06_1_led_pixel.adb\t - Chapter 6.1 NeoPixel LED Pixel\n"
- '3. sketch_06_2_rainbow_light.adb - Chapter 6.2 NeoPixel Rainbow Light

