- 'Ada Wiki is a small library that provides a parser and renderer for Markdown and
  several

  '
- 'other Wiki syntaxes.  The library allows to:

  '
- '

  '
- '* Parse a Markdown text but other Wiki such as Mediawiki, Creole, PhpBB, Dotclear
  and Google Code,

  '
- '* Parse HTML content in embedded wiki text,

  '
- '* Filter out the wiki, HTML or text through customizable filters,

  '
- '* Render the wiki text in HTML, text or another wiki format

  '
- '

  '
- 'The Ada Wiki library is used by [Ada Web Application](https://gitlab.com/stcarrez/ada-awa)

  '
- 'for the implementation of the blog and wiki online plugins and by [mdshow](https://gitlab.com/stcarrez/mdshow)
  a terminal based

  '
- 'Markdown viewer.

