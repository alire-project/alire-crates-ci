- '   License: Apache-2.0 WITH LLVM-exception

  '
- '   Long_Description: These are components developed over the past 45+ years of
  Ada work, updated as Ada evolved, and formally proven when within the SPARK subset.

  '
- 'Most are proven to the Gold or Platinum level, but when necessary they are proven
  to the Silver level, i.e., absence of run-time errors.

  '
- 'They have been used in both host and embedded projects, many professional and a
  few for fun.

  '
- '

  '
- 'Sample contents:

  '
- '  Sequential Bounded Buffers

  '
- '  Sequential Bounded Stacks (i.e., not thread-safe)

  '
- '  ...

  '
- '  Protected types providing synchronization protocols

  '
- '  PI and PID Controls

  '
- '  Image functions for floating- and fixed-point types, in standard (i.e., not scientific)
  notation

  '
- '  Gaussian, Categorical, and Scaled Uniform Random Number Generators

  '
- '  Recursive Moving Average (RMA) filters for signal processing

  '
- '  Sorting and Searching routines

  '
- '  ...

