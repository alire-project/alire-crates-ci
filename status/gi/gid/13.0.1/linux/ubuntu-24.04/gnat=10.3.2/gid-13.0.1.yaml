  '
- 'The Generic Image Decoder (GID) is a low-level Ada package for decoding a broad
  variety of image formats,

  '
- 'from any data stream, to any kind of medium, be it an in-memory bitmap, a GUI object,
  some other stream,

  '
- 'floating-point data for scientific calculations, a browser element, a device, ...

  '
- '

  '
- 'Currently supported formats are: BMP, GIF, JPEG, PNG, PNM (PBM, PGM, PPM), QOI,
  TGA

  '
- '

  '
- "Animations (GIF, PNG) are supported. \n"
- '

  '
- 'Some features:

  '
- '

  '
- '* *Fast*! Up to 2.8 times faster than ImageMagick.

  '
- '* Task safe

  '
- '* Endian-neutral

  '
- '* Multi-platform, but native code build

  '
- '* Standalone (no dependency on other libraires, bindings, etc.; no extra component
  needed for running)

  '
- '* Unconditionally portable code: OS-, CPU-, compiler- independent code (*).

  '
- '* Pure Ada 2012: this package can be used in projects in Ada 2012 and later versions
  of the Ada language

  '
- '* Tests, demos and tools included.

  '
- "* *Free*, open-source \n"
- '

  '
- '______

  '
- '

  '
