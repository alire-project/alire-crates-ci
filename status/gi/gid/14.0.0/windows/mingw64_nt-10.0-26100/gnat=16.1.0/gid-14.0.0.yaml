- 'The Generic Image Decoder (GID) is a low-level Ada package for decoding a broad
  variety of image formats,

  '
- 'from any data stream, to any kind of medium, be it an in-memory bitmap, a GUI object,
  some other stream,

  '
- 'floating-point data for scientific calculations, a browser element, a device, ...

  '
- '

  '
- 'Currently supported formats are: BMP, GIF, JPEG, PNG, PNM (PBM, PGM, PPM), QOI,
  TGA

