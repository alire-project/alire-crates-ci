- '   Long_Description: The primary tool in this crate is the `a0b-runtime` generator.

  '
- 'While GNAT provides several standard runtimes (such as `light`, `light-tasking`,
  and `embedded`), these can be difficult to customize for specific project requirements.

  '
- '

  '
- '`a0b-tools` solves this by allowing developers to generate a tailored, project-specific
  runtime from a single configuration file.

  '
- 'It also enables the creation of runtimes for hardware platforms and MCUs that do
  not have prebuilt GNAT runtimes available, providing full control over startup code,
  linker scripts, and Ada library components.

  '
