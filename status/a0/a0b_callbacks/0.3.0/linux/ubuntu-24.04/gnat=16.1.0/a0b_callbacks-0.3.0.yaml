- '   Long_Description: Provides type-safe mechanisms to invoke user-defined callback
  subprograms with optional user data, designed specifically for embedded systems
  and light runtimes without tasking constructs.

  '
- '

  '
- 'The library offers a core `Callback` type alongside several generic child packages
  tailored for different parameter types:

  '
- '- `Generic_Parameterless`: For parameterless procedures.

  '
- '- `Generic_Subprogram`: For procedures accepting parameters of unconstrained limited
  types.

  '
- '- `Generic_Non_Dispatching`: For procedures with class-wide type parameters.

  '
- '- `Generic_Dispatching`: For procedures with unconstrained abstract tagged type
  parameters.

  '
- '- `Generic_Discrete`: For procedures with discrete type parameters.

  '
- '

  '
- 'Ideal for interrupt handlers, event-driven device drivers, and lightweight task
  synchronization in bare-metal environments.

  '
