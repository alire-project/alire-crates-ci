- '   Notes: # Version 8.2.0:

  '
- '* Updated AdaCL.Trace for better wide-string support

  '
- '* Added a new line-insert filter to AdaCL.SAR that can insert multiple lines and/or
  only at the first matched location

  '
- '* AdaCL.Serial now generates the macOS serial communication layer on the fly

