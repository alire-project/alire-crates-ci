- 'Supports text processing with the following encodings:

  '
- '- Universal Character Set 4, Big-Endian (UCS-4 BE)

  '
- '- Universal Character Set 4, Little-Endian (UCS-4 LE)

  '
- '- Universal Character Set 2, Big-Endian (UCS-2 BE)

  '
