- "   Build Switches: \n"
- '   Description: AdaCL: SPARK gold core shared by desktop, embedded and bare-metal

  '
- '   License: GPL-3.0-or-later

  '
- '   Long_Description: Ada Class Library core crate for Ada 2022.

  '
- '

  '
- '`adacl` is the shared root of the AdaCL family. It is suitable for both

  '
- 'embedded and desktop targets and is proven to SPARK gold. The former

  '
- 'desktop utilities no longer live here; they were moved to `adacl_desktop`

  '
- 'in 8.0.0.

  '
- '

  '
- 'Sister crates:

  '
- '

  '
- '- [adacl_aunit](https://alire.ada.dev/crates/adacl_aunit) - AUnit-compatible assertions
  and parameterised tests

  '
- '- [adacl_desktop](https://alire.ada.dev/crates/adacl_desktop) - Getopt, strings,
  calendar, tracing, queues, and smart pointers

  '
- '- [adacl_eastrings](https://alire.ada.dev/crates/adacl_eastrings) - encoding-aware
  string utilities

  '
- '- [adacl_embedded](https://alire.ada.dev/crates/adacl_embedded) - lightweight tracing
  and text I/O for embedded targets

  '
- '- [adacl_regexp](https://alire.ada.dev/crates/adacl_regexp) - regular expressions
  and SPITBOL patterns

  '
- '- [adacl_sar](https://alire.ada.dev/crates/adacl_sar) - search and replace for
  String, Wide_String, and Wide_Wide_String

  '
- '- [adacl_serial](https://alire.ada.dev/crates/adacl_serial) - SPARK-friendly serial
  I/O helpers over GNAT.Serial_Communications

  '
- '

  '
- 'Source: [SourceForge](https://sourceforge.net/p/adacl/git/ci/master/tree/adacl/src/)

  '
- 'Documentation: [GNATdoc](https://adacl.sourceforge.net/gnatdoc/adacl/index.html)

  '
- '

  '
- '   Maintainer: Martin Krischik <krischik@users.sourceforge.net>

  '
- '   Maintainers_Logins: krischik

  '
- '   Name: adacl

  '
- '   Notes: Breaking change in 8.0.0: AdaCL has been split.

  '
- '

  '
- '`adacl` is now the SPARK-proven common foundation used by both desktop and

  '
- 'embedded crates. The previous desktop API (Getopt, Strings, Calendar,

  '
- 'Tracing, Protected Queue, Smart Pointers) lives in `adacl_desktop`.

  '
- '

  '
- 'Applications that used those utilities must replace the old dependency:

  '
- '

  '
- '    [[depends-on]]

  '
- '    adacl = "^7.2"

  '
- '

  '
- 'with:

  '
- '

  '
- '    [[depends-on]]

  '
- '    adacl_desktop = "^8.0"

  '
- '

  '
- '`adacl_desktop` depends on `adacl`. Keep a direct `adacl` dependency only

  '
- 'when the shared core is all you need.

  '
