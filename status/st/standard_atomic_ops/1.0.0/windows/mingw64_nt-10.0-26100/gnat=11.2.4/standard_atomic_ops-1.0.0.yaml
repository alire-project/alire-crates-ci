- "They are provided for use with those bare-board GNAT runtimes that do not (yet)\
  \ include them, for example Arm-elf (the only target tested to date). \n"
- 'The sources here are verbatim copies taken from a native runtime. As such, the
  implementations are GNAT-specific so their use with other compilers will not work.

  '
- 'Once the shipped GNAT runtimes include them you can simply remove any references
  to this crate.

  '
- 'Note that the license includes the GCC Runtime Library Exception.

