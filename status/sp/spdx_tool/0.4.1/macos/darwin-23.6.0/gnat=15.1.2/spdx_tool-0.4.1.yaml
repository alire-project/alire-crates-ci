- 'spdx_tool=0.4.1: SPDX license detection and management tool

  '
- 'Origin: commit 0ca2cee437e71cd5f8a32edaa6f3facff8868be3 from https://gitlab.com/stcarrez/spdx-tool.git

  '
- 'Properties:

  '
- '   Post_Fetch run: sh ./alire-setup.sh (from ${CRATE_ROOT}/.)

  '
- '   Author: ciceron

  '
- '   Description: SPDX license detection and management tool

  '
- '   Executable: spdx-tool

  '
- '   case OS is

  '
- '      when Freebsd => GPR External: USE_MAGICADA := no

  '
- '      when Linux => GPR External: USE_MAGICADA := yes

  '
- '      when Macos => GPR External: USE_MAGICADA := no

  '
- '      when Windows => GPR External: USE_MAGICADA := no

  '
- '   License: Apache-2.0

  '
- '   Long_Description: spdx-tool scans the source files to identify licenses and
  allows to update them in order to use the

  '
- 'SPDX license format.  It can be used to:

  '
- '

  '
- '* identify the license used in source files of a project,

  '
- '* produce a JSON/XML report for the licenses found with the list of files,

  '
- '* replace a license header by the [SPDX license](https://spdx.org/licenses/) tag
  equivalent.

  '
- '

  '
- 'Identify licenses used in a project:

  '
- '

  '
- '```

  '
- 'spdx-tool

  '
- '```

  '
- '

  '
- 'Identify files matching a given license:

  '
- '

  '
- '```

  '
- 'spdx-tool --only-licenses=Apache-2.0 -f

  '
- '```

  '
- '

  '
- 'Check the license header before replacing it:

  '
- '

  '
- '```

  '
- 'spdx-tool --only-licenses=Apache-2.0 --print-license --line-number src

  '
- '```

  '
- '

  '
- 'Replace the license header by the `SPDX-License-Identifier` header:

  '
- '

  '
- '```

  '
- 'spdx-tool --only-licenses=Apache-2.0 --update=spdx src

  '
- '```

  '
- '

  '
- 'Build an XML or JSON report of files with their licenses:

  '
- '

  '
- '```

  '
- 'spdx-tool --output-xml=report.xml

  '
- '```

  '
- '

  '
