  '
- '   GPR Scenario: UTIL_HAS_TIME_64 := yes | no

  '
- '   GPR Scenario: UTIL_LIBRARY_TYPE := relocatable | static | static-pic

  '
- '   GPR Scenario: UTIL_OS := win32 | win64 | linux32 | linux64 | macos64 | netbsd32
  | netbsd64 | freebsd32 | freebsd64 | openbsd32 | openbsd64

  '
- '   case OS is

  '
- '      when Freebsd => (case Word_Size is Bits_32 => GPR External: UTIL_OS := freebsd32,
  Bits_64 => GPR External: UTIL_OS := freebsd64)

  '
- '      when Linux => (case Word_Size is Bits_32 => GPR External: UTIL_OS := linux32,
  Bits_64 => GPR External: UTIL_OS := linux64)

  '
- '      when Macos => GPR External: UTIL_OS := macos64

  '
- '      when Openbsd => (case Word_Size is Bits_32 => GPR External: UTIL_OS := openbsd32,
  Bits_64 => GPR External: UTIL_OS := openbsd64)

  '
- '      when Windows => (case Word_Size is Bits_32 => GPR External: UTIL_OS := win32,
  Bits_64 => GPR External: UTIL_OS := win64)

