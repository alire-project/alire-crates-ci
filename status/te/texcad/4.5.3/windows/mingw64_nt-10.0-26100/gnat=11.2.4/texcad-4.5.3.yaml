- 'TeXCAD is a program for drawing or retouching {picture}s in LaTeX.

  '
- 'It extends the original {picture} capabilities, even without any obligatory LaTeX
  package, class or style sheet.

  '
- 'The core of TeXCAD is totally portable.

  '
